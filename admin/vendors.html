<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendors — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          🏬
          <span>Vendors</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='commissions.html'">
          🧮
          <span>Commissions</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Vendors
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Vendors
          </h1>

          <p class="bf-admin-welcome-sub">
            Onboard, edit, and manage seller accounts on Bestify.
          </p>

        </section>


        <div style="margin-bottom:20px;">
          <button
            type="button"
            id="addVendorBtn"
            class="bf-btn bf-btn-primary">
            + Add Vendor
          </button>
        </div>


        <!-- Search + filter -->
        <div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">

          <input
            type="search"
            id="vendorSearch"
            class="bf-input"
            placeholder="Search by shop name, owner, or mobile..."
            style="flex:1; min-width:220px; max-width:500px;">

          <select id="vendorStatusFilter" class="bf-select" style="max-width:170px;">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Blocked">Blocked</option>
          </select>

        </div>


        <!-- Vendor count -->
        <div
          id="vendorCount"
          style="margin-bottom:15px;font-weight:600;">
          Loading vendors...
        </div>


        <!-- Vendors -->
        <div
          id="vendorsList"
          style="
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
            gap:16px;
          ">

          <div class="bf-card" style="padding:20px;">
            Loading vendors...
          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Add / Edit Vendor Modal -->
  <div id="vendorFormModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="vendorFormCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title" id="vendorFormTitle">Add Vendor</h2>

      <form id="vendorForm">

        <div class="bf-field">
          <label class="bf-label">Shop / Business Name</label>
          <input type="text" id="shopName" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Owner Name</label>
          <input type="text" id="ownerName" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Email</label>
          <input type="email" id="vendorEmail" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Mobile</label>
          <input type="tel" id="vendorPhone" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Category</label>
          <input type="text" id="vendorCategory" class="bf-input" placeholder="e.g. Mobile Accessories">
        </div>

        <div class="bf-field">
          <label class="bf-label">Address</label>
          <textarea id="vendorAddress" class="bf-textarea"></textarea>
        </div>

        <div class="bf-field">
          <label class="bf-label">Commission Rate (%)</label>
          <input type="number" id="commissionRate" class="bf-input" min="0" max="100" value="10">
        </div>

        <div class="bf-field">
          <label class="bf-label">Status</label>
          <select id="vendorStatus" class="bf-select">
            <option value="Pending">Pending</option>
            <option value="Active">Active</option>
            <option value="Blocked">Blocked</option>
          </select>
        </div>

        <button
          type="submit"
          id="vendorFormSubmitBtn"
          class="bf-btn bf-btn-primary bf-btn-block">
          Save Vendor
        </button>

      </form>
    </div>
  </div>


  <script type="module" src="vendors.js"></script>

</body>
</html>
