<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button class="bf-admin-nav-item" onclick="location.href='index.html'">📊<span>Dashboard</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='users.html'">👥<span>Users</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='products.html'">📦<span>Products</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='orders.html'">🧾<span>Orders</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='vendors.html'">🏬<span>Vendors</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='payments.html'">💳<span>Payments</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='wallets.html'">👛<span>Wallets</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='commissions.html'">🧮<span>Commissions</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='cashback.html'">💸<span>Cashback</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='referrals.html'">🔗<span>Referrals</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='repairs.html'">🔧<span>Repairs</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='chats.html'">💬<span>Chats</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='notifications.html'">🔔<span>Notifications</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='reports.html'">📈<span>Reports</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='audit-log.html'">🗂️<span>Audit Log</span></button>

        <button class="bf-admin-nav-item bf-admin-nav-active">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">
        <div class="bf-admin-header-title">
          <span class="bf-admin-header-brand">Bestify Mobile</span>
          <span class="bf-admin-header-label">Settings</span>
        </div>
      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">
          <h1>Store Settings</h1>
          <p class="bf-admin-welcome-sub">
            Configure store details, shipping, tax, and checkout behaviour.
          </p>
        </section>

        <div id="settingsLoading" class="bf-card" style="padding:20px; margin-bottom:20px;">
          Loading settings...
        </div>

        <form id="settingsForm" class="bf-hidden" style="display:flex; flex-direction:column; gap:20px; max-width:640px;">

          <!-- Store Details -->
          <div class="bf-card" style="padding:20px;">

            <h2 style="font-size:16px; margin:0 0 14px;">Store Details</h2>

            <div class="bf-field">
              <label class="bf-label">Store Name</label>
              <input type="text" id="storeName" class="bf-input" required>
            </div>

            <div class="bf-field">
              <label class="bf-label">Support Email</label>
              <input type="email" id="supportEmail" class="bf-input">
            </div>

            <div class="bf-field">
              <label class="bf-label">Support Phone</label>
              <input type="tel" id="supportPhone" class="bf-input">
            </div>

            <div class="bf-field">
              <label class="bf-label">Store Address</label>
              <textarea id="storeAddress" class="bf-textarea" rows="2"></textarea>
            </div>

          </div>


          <!-- Shipping & Tax -->
          <div class="bf-card" style="padding:20px;">

            <h2 style="font-size:16px; margin:0 0 14px;">Shipping &amp; Tax</h2>

            <div class="bf-field">
              <label class="bf-label">Standard Shipping Fee (₹)</label>
              <input type="number" id="shippingFee" class="bf-input" min="0" step="0.01">
            </div>

            <div class="bf-field">
              <label class="bf-label">Free Shipping Threshold (₹)</label>
              <input type="number" id="freeShippingThreshold" class="bf-input" min="0" step="0.01">
              <div style="font-size:12px; opacity:.65; margin-top:4px;">
                Orders at or above this amount ship free. Leave 0 to disable.
              </div>
            </div>

            <div class="bf-field">
              <label class="bf-label">Tax Rate (%)</label>
              <input type="number" id="taxRate" class="bf-input" min="0" max="100" step="0.01">
            </div>

          </div>


          <!-- Checkout Options -->
          <div class="bf-card" style="padding:20px;">

            <h2 style="font-size:16px; margin:0 0 14px;">Checkout Options</h2>

            <label style="display:flex; align-items:center; gap:10px; margin-bottom:12px; cursor:pointer;">
              <input type="checkbox" id="codEnabled" style="width:18px; height:18px;">
              <span>Cash on Delivery (COD) enabled</span>
            </label>

            <label style="display:flex; align-items:center; gap:10px; margin-bottom:12px; cursor:pointer;">
              <input type="checkbox" id="onlinePaymentsEnabled" style="width:18px; height:18px;">
              <span>Online payments enabled</span>
            </label>

            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
              <input type="checkbox" id="maintenanceMode" style="width:18px; height:18px;">
              <span>Maintenance mode (storefront shows a "closed" notice)</span>
            </label>

          </div>


          <button type="submit" id="saveSettingsBtn" class="bf-btn bf-btn-primary" style="align-self:flex-start;">
            Save Settings
          </button>

          <div id="settingsMeta" style="font-size:12px; opacity:.6;"></div>

        </form>

      </main>

    </div>

  </div>


  <script type="module" src="settings.js"></script>

</body>
</html>
