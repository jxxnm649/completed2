<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orders — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          🧾
          <span>Orders</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='vendors.html'">
          🏬
          <span>Vendors</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='commissions.html'">
          🧮
          <span>Commissions</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Orders
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Orders
          </h1>

          <p class="bf-admin-welcome-sub">
            Track and update every order placed on Bestify.
          </p>

        </section>


        <!-- Search + filter -->
        <div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">

          <input
            type="search"
            id="orderSearch"
            class="bf-input"
            placeholder="Search by customer name, mobile, or order ID..."
            style="flex:1; min-width:220px; max-width:500px;">

          <select id="orderStatusFilter" class="bf-select" style="max-width:180px;">
            <option value="All Status">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Packed">Packed</option>
            <option value="Shipped">Shipped</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>

        </div>


        <!-- Order count -->
        <div
          id="orderCount"
          style="margin-bottom:15px;font-weight:600;">
          Loading orders...
        </div>


        <!-- Orders -->
        <div
          id="ordersList"
          style="display:flex; flex-direction:column; gap:14px;">

          <div class="bf-card" style="padding:20px;">
            Loading orders...
          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Order Details Modal -->
  <div id="orderDetailsModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="orderDetailsCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title">Order Details</h2>

      <div id="orderDetailsContent">
        Loading...
      </div>

    </div>
  </div>


  <script type="module" src="orders.js"></script>

</body>
</html>
