<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestify Store</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bf-has-nav">

    <div class="container">

        <div class="brand-header">
            <span class="brand-text">Bestifymobile</span>
            <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Menu dropdown (social links) -->
        <div class="menu-dropdown" id="menuDropdown">
            <a href="https://chat.whatsapp.com/Cks7jxkxJJKGBnepHs8U5j" target="_blank" rel="noopener" class="menu-link">
                <i class="fa-brands fa-whatsapp" style="color:#25D366"></i> WhatsApp Community
            </a>
            <a href="https://whatsapp.com/channel/0029VbBwTCkDp2QGRkvcaq2v" target="_blank" rel="noopener" class="menu-link">
                <i class="fa-brands fa-whatsapp" style="color:#25D366"></i> WhatsApp Updates
            </a>
            <a href="https://www.instagram.com/bestify_mobile_kolavi" target="_blank" rel="noopener" class="menu-link">
                <i class="fa-brands fa-instagram" style="color:#d6249f"></i> Instagram
            </a>
            <a href="https://youtube.com/@bestifymobilekolavi" target="_blank" rel="noopener" class="menu-link">
                <i class="fa-brands fa-youtube" style="color:#FF0000"></i> YouTube
            </a>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search Products">
        </div>

        <!-- Categories -->
        <div class="category-bar" id="categoryBar"></div>

        <!-- Featured / Best Sellers -->
        <h2 id="featuredTitle" class="section-title" style="display:none;">⭐ Best Sellers</h2>
        <div id="featuredContainer" class="products"></div>

        <!-- Products -->
        <h2 class="section-title">Our Products</h2>

        <div id="productContainer" class="products">
        </div>

        <!-- Contact / Visit Us Footer -->
        <div class="shop-footer">
            <h2 class="section-title">📍 Visit Us / Connect</h2>

            <div class="shop-photos">
                <img src="shop-photos/shop-front.jpg" alt="Bestify Mobile Kolavi shop front">
                <img src="shop-photos/shop-street.jpg" alt="Bestify Mobile Kolavi street view">
            </div>

            <a class="shop-map-btn" href="https://maps.app.goo.gl/xfazo8HGgp3R59V37" target="_blank" rel="noopener">
                📍 Get Directions
            </a>

            <a class="shop-call-btn" href="tel:+919110690727">
                📞 Call Us: 9110690727
            </a>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="home.html" class="active">
            <span>🏠</span>
            <p>Home</p>
        </a>

        <a href="wishlist.html">
            <span>❤️</span>
            <p>Wishlist</p>
        </a>

        <a href="orders.html">
            <span>📦</span>
            <p>Orders</p>
        </a>

        <a href="profile.html">
            <span>👤</span>
            <p>Profile</p>
        </a>

        <button type="button" id="moreMenuBtn" class="bottom-nav-more">
            <span>☰</span>
            <p>More</p>
        </button>

    </nav>

    <script type="module" src="home.js"></script>
    <script type="module" src="profile-menu.js"></script>

    <script>
        const menuToggle = document.getElementById("menuToggle");
        const menuDropdown = document.getElementById("menuDropdown");

        menuToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            const isOpen = menuDropdown.classList.toggle("open");
            menuToggle.setAttribute("aria-expanded", isOpen);
        });

        document.addEventListener("click", (e) => {
            if (!menuDropdown.contains(e.target) && !menuToggle.contains(e.target)) {
                menuDropdown.classList.remove("open");
                menuToggle.setAttribute("aria-expanded", "false");
            }
        });
    </script>

</body>

</html>
